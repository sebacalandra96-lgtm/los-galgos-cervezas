<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Los Galgos — Contador de Cervezas</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  :root {
    --fondo: #1c1712;
    --superficie: #2a2119;
    --superficie-alta: #362a1e;
    --borde: #443628;
    --texto: #f2e9d8;
    --texto-tenue: #a89678;
    --ambar: #e8a33d;
    --ambar-fuerte: #f4b94f;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--fondo);
    background-image:
      radial-gradient(ellipse 600px 300px at 50% -10%, rgba(232,163,61,0.08), transparent);
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--texto);
    padding: 28px 16px 40px;
    display: flex;
    justify-content: center;
  }

  main {
    width: 100%;
    max-width: 460px;
  }

  header {
    text-align: center;
    margin-bottom: 22px;
  }

  .eyebrow {
    font-size: 0.72rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--texto-tenue);
    font-weight: 600;
  }

  h1 {
    font-size: 1.7rem;
    font-weight: 800;
    letter-spacing: -0.01em;
    margin: 4px 0 0;
    text-wrap: balance;
  }

  .marcador {
    background: var(--superficie);
    border: 1px solid var(--borde);
    border-radius: 18px;
    padding: 18px 20px 20px;
    text-align: center;
    margin-bottom: 22px;
  }

  .marcador-label {
    font-size: 0.8rem;
    color: var(--texto-tenue);
    font-weight: 600;
  }

  .marcador-num {
    font-size: 3.2rem;
    font-weight: 800;
    color: var(--ambar-fuerte);
    line-height: 1.05;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
  }

  .grid {
    display: grid;
    gap: 10px;
  }

  .card {
    background: var(--superficie);
    border: 1px solid var(--borde);
    border-radius: 16px;
    padding: 12px 12px 12px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .persona {
    min-width: 0;
    flex: 1;
  }

  .nombre {
    font-size: 1.02rem;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .cantidad {
    font-size: 1.5rem;
    font-weight: 800;
    color: var(--ambar);
    font-variant-numeric: tabular-nums;
    margin-top: 1px;
  }

  .botones {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
  }

  button {
    border: none;
    border-radius: 12px;
    cursor: pointer;
    touch-action: manipulation;
    font-weight: 700;
  }

  .btn-mas {
    background: var(--ambar);
    color: #22160a;
    font-size: 1.3rem;
    width: 48px;
    height: 48px;
  }

  .btn-menos {
    background: var(--superficie-alta);
    color: var(--texto-tenue);
    font-size: 1.1rem;
    width: 40px;
    height: 48px;
  }

  .btn-mas:active, .btn-menos:active {
    transform: scale(0.93);
  }

  footer {
    text-align: center;
    margin-top: 26px;
  }

  .btn-reset {
    background: transparent;
    color: var(--texto-tenue);
    border: 1px solid var(--borde);
    font-weight: 500;
    font-size: 0.82rem;
    padding: 9px 18px;
    border-radius: 10px;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<main>
  <header>
    <div class="eyebrow">Los Galgos</div>
    <h1>Contador de Cervezas</h1>
  </header>

  <div class="marcador">
    <div class="marcador-label">QUEDAN EN LA HELADERA</div>
    <div class="marcador-num" id="stock">--</div>
  </div>

  <div class="grid" id="grid"></div>

  <footer>
    <button class="btn-reset" onclick="reiniciar()">Reiniciar noche</button>
  </footer>
</main>

<script>
  const grid = document.getElementById('grid');
  const stockEl = document.getElementById('stock');

  function render(estado) {
    stockEl.textContent = estado.stock;
    grid.innerHTML = '';
    for (const nombre of Object.keys(estado.contadores)) {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="persona">
          <div class="nombre">${nombre}</div>
          <div class="cantidad">${estado.contadores[nombre]} 🍺</div>
        </div>
        <div class="botones">
          <button class="btn-menos" onclick="restar('${nombre}')">−</button>
          <button class="btn-mas" onclick="sumar('${nombre}')">+</button>
        </div>
      `;
      grid.appendChild(card);
    }
  }

  async function cargarEstado() {
    const res = await fetch('/api/state');
    render(await res.json());
  }

  async function sumar(nombre) {
    const res = await fetch('/api/sumar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ nombre })
    });
    render(await res.json());
  }

  async function restar(nombre) {
    const res = await fetch('/api/restar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ nombre })
    });
    render(await res.json());
  }

  async function reiniciar() {
    if (!confirm('¿Reiniciar todos los contadores y el stock a 100?')) return;
    const res = await fetch('/api/reset', { method: 'POST' });
    render(await res.json());
  }

  cargarEstado();
  setInterval(cargarEstado, 2000);
</script>
</body>
</html>
